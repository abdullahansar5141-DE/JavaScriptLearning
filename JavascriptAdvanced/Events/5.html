    <style>
        body {

            padding: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;

        }
        .navbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background-color: #f4f4f5;

        }
        .display-area {
            flex: 1;
            background-color: #18181b;

            display: flex;
            justify-content: center;
            align-items: center;
